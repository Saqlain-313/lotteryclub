<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rider · Superbike</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ----- dark bg with subtle texture ----- */
    body {
      background: #0c0a0a;
      background-image: radial-gradient(circle at 10% 20%, #1f1717 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, #221b1b 0%, transparent 45%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1rem;
    }

    /* glassmorphism card */
    .glass-card {
      background: rgba(10, 8, 8, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 100, 30, 0.05);
    }

    /* image glow & float */
    .bike-img {
      filter: drop-shadow(0 8px 30px rgba(255, 70, 0, 0.4));
      transition: filter 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }
    .bike-img:hover {
      filter: drop-shadow(0 0 50px #ff4d00) drop-shadow(0 0 90px #ff2a00);
      transform: scale(1.02) rotate(0.5deg);
    }

    /* floating animation */
    .float-bike {
      animation: floatY 4s ease-in-out infinite;
    }
    @keyframes floatY {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    /* pulse ring for primary CTA */
    .btn-pulse {
      animation: pulse-ring 2.4s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(255, 80, 20, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(255, 80, 20, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 80, 20, 0); }
    }

    /* clickable cards */
    .clickable {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .clickable:active {
      transform: scale(0.96);
    }

    /* custom scroll */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #161111; }
    ::-webkit-scrollbar-thumb { background: #ff5722; border-radius: 20px; }

    /* extra micro-animations */
    .hover-glow {
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .hover-glow:hover {
      border-color: #ff6720;
      box-shadow: 0 0 20px rgba(255, 80, 20, 0.15);
    }

    /* badge shimmer */
    .badge-shimmer {
      background: linear-gradient(145deg, rgba(255, 100, 30, 0.15), rgba(255, 50, 0, 0.05));
      border: 1px solid rgba(255, 100, 30, 0.25);
    }
  </style>
</head>
<body>

  <!-- ===== MAIN WRAPPER ===== -->
  <div class="w-full max-w-6xl glass-card rounded-3xl p-5 md:p-10 transition-all duration-500 hover:border-orange-700/30">

    <!-- ===== HEADER ===== -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-6">
      <div>
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight flex items-center gap-3">
          <span class="bg-gradient-to-r from-orange-400 to-amber-300 bg-clip-text text-transparent drop-shadow-lg">
            <i class="fas fa-motorcycle mr-2 text-orange-500"></i>RIDER
          </span>
          <span class="text-xs font-mono bg-orange-500/20 text-orange-300 px-3 py-1 rounded-full border border-orange-400/30 backdrop-blur-sm hidden sm:inline-block">
            <i class="fas fa-circle text-[8px] text-orange-400 animate-pulse mr-1"></i> LIVE
          </span>
        </h1>
        <p class="text-gray-400 text-sm tracking-widest uppercase mt-1 flex items-center gap-2">
          <i class="fas fa-bolt text-orange-400"></i> unleash the beast
          <span class="hidden md:inline-block text-gray-600">•</span>
          <span class="hidden md:inline-block text-gray-500 text-xs font-light">2026</span>
        </p>
      </div>
      <div class="flex items-center gap-3">
        <div class="bg-white/5 backdrop-blur-sm px-4 py-1.5 rounded-full border border-white/10 text-xs text-gray-300 flex items-center gap-2 clickable" onclick="alert('🏍️ Rider profile · ready to ride')">
          <i class="fas fa-user-circle text-orange-400 text-base"></i> <span class="hidden sm:inline">Rider</span>
        </div>
      </div>
    </div>

    <!-- ===== SUPERBIKE IMAGE (clickable) ===== -->
    <div class="relative rounded-2xl overflow-hidden border border-white/5 bg-black/30 p-1 clickable" onclick="alert('⚡ SUPERBIKE · Ducati Panigale V4 · click to ignite')">
      <div class="relative w-full h-72 md:h-96 lg:h-[450px] overflow-hidden rounded-xl">
        <!-- image from unsplash (superbike) -->
        <img 
          src="https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=1400&q=80&auto=format&fit=crop" 
          alt="Superbike Ducati Panigale V4" 
          class="w-full h-full object-cover bike-img float-bike"
          loading="lazy"
        />
        <!-- gradient overlay for better text -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent pointer-events-none"></div>

        <!-- floating badge: click hint -->
        <div class="absolute bottom-5 left-5 bg-black/60 backdrop-blur-md px-4 py-2 rounded-full border border-orange-400/40 text-xs font-medium flex items-center gap-2 pointer-events-none">
          <i class="fas fa-hand-pointer text-orange-400 animate-bounce"></i>
          <span class="text-gray-200">click to ride</span>
        </div>

        <!-- top right corner icon -->
        <div class="absolute top-4 right-4 bg-black/50 backdrop-blur-sm p-2.5 rounded-full border border-white/10 pointer-events-none">
          <i class="fas fa-crown text-amber-400 text-lg"></i>
        </div>

        <!-- bottom right: speed badge (just design) -->
        <div class="absolute bottom-5 right-5 bg-black/50 backdrop-blur-sm px-3 py-1.5 rounded-full border border-white/10 text-xs text-gray-300 pointer-events-none flex items-center gap-1">
          <i class="fas fa-gauge-high text-orange-400"></i> 320 km/h
        </div>
      </div>
    </div>

    <!-- ===== SPECS GRID (clickable cards) ===== -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6">
      <!-- card 1 -->
      <div class="bg-white/5 backdrop-blur-sm rounded-xl p-4 border border-white/5 hover:border-orange-500/50 transition-all duration-300 clickable hover-glow" onclick="alert('⚡ 214 HP · pure adrenaline')">
        <div class="flex items-center gap-3">
          <div class="bg-orange-500/20 p-2.5 rounded-full">
            <i class="fas fa-gauge-high text-orange-400 text-xl"></i>
          </div>
          <div>
            <p class="text-gray-400 text-xs uppercase tracking-wider">Power</p>
            <p class="text-xl font-bold">214 <span class="text-sm font-light text-gray-300">HP</span></p>
          </div>
        </div>
      </div>
      <!-- card 2 -->
      <div class="bg-white/5 backdrop-blur-sm rounded-xl p-4 border border-white/5 hover:border-orange-500/50 transition-all duration-300 clickable hover-glow" onclick="alert('⚡ 0-100 km/h in 2.8s · rocket launch')">
        <div class="flex items-center gap-3">
          <div class="bg-orange-500/20 p-2.5 rounded-full">
            <i class="fas fa-tachometer-alt text-orange-400 text-xl"></i>
          </div>
          <div>
            <p class="text-gray-400 text-xs uppercase tracking-wider">0-100</p>
            <p class="text-xl font-bold">2.8 <span class="text-sm font-light text-gray-300">s</span></p>
          </div>
        </div>
      </div>
      <!-- card 3 -->
      <div class="bg-white/5 backdrop-blur-sm rounded-xl p-4 border border-white/5 hover:border-orange-500/50 transition-all duration-300 clickable hover-glow" onclick="alert('⚡ Top speed 320 km/h · race ready')">
        <div class="flex items-center gap-3">
          <div class="bg-orange-500/20 p-2.5 rounded-full">
            <i class="fas fa-flag-checkered text-orange-400 text-xl"></i>
          </div>
          <div>
            <p class="text-gray-400 text-xs uppercase tracking-wider">Top speed</p>
            <p class="text-xl font-bold">320 <span class="text-sm font-light text-gray-300">km/h</span></p>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== CTA + SOCIAL (clickable) ===== -->
    <div class="flex flex-wrap items-center justify-between gap-4 mt-8 pt-5 border-t border-white/10">
      <div class="flex flex-wrap gap-3">
        <!-- primary CTA with pulse -->
        <button class="btn-pulse bg-gradient-to-r from-orange-600 to-orange-500 hover:from-orange-500 hover:to-amber-500 text-white font-bold py-2.5 px-7 rounded-full shadow-lg shadow-orange-600/30 transition-all duration-300 flex items-center gap-2 clickable" onclick="alert('🏁 ENGINE START · RIDER MODE ACTIVATED')">
          <i class="fas fa-play-circle"></i> Start Engine
        </button>
        <!-- secondary -->
        <button class="bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/20 hover:border-orange-400/60 text-gray-200 font-medium py-2.5 px-6 rounded-full transition-all duration-300 flex items-center gap-2 clickable" onclick="alert('🔧 Customize your superbike · specs & more')">
          <i class="fas fa-cog"></i> Customize
        </button>
      </div>
      <!-- social icons -->
      <div class="flex items-center gap-3">
        <span class="text-gray-500 text-sm hidden md:inline"><i class="fas fa-share-alt mr-1"></i> share</span>
        <div class="flex gap-2">
          <div class="w-9 h-9 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-orange-500/20 hover:border-orange-400 transition-all duration-300 clickable" onclick="alert('📸 Share your ride with #RiderSuperbike')">
            <i class="fab fa-instagram text-orange-300"></i>
          </div>
          <div class="w-9 h-9 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-orange-500/20 hover:border-orange-400 transition-all duration-300 clickable" onclick="alert('🐦 Follow @RiderSuperbike for more')">
            <i class="fab fa-twitter text-orange-300"></i>
          </div>
          <div class="w-9 h-9 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-orange-500/20 hover:border-orange-400 transition-all duration-300 clickable" onclick="alert('🎥 Watch the full review on YouTube')">
            <i class="fab fa-youtube text-orange-300"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== FOOTER / extra clickable ===== -->
    <div class="mt-6 flex flex-wrap items-center justify-between text-gray-500 text-xs">
      <div class="flex flex-wrap gap-4 clickable" onclick="alert('🏍️ Ride hard · live free')">
        <span><i class="fas fa-quote-left text-orange-400/50 mr-1"></i> born to ride</span>
        <span class="hidden sm:inline">•</span>
        <span><i class="fas fa-bolt text-orange-400/50 mr-1"></i> 2026 superbike</span>
      </div>
      <div class="flex items-center gap-3 clickable" onclick="alert('📋 Full specs · download brochure')">
        <span class="hover:text-orange-300 transition-colors"><i class="far fa-file-pdf mr-1"></i> brochure</span>
        <span class="hover:text-orange-300 transition-colors"><i class="far fa-hand-pointer mr-1"></i> click</span>
      </div>
    </div>

    <!-- ===== hidden extra: full page click ===== -->
    <div class="mt-3 text-center text-[10px] text-gray-600/50 italic select-none">
      <i class="fas fa-mouse-pointer mr-1"></i> click any card, button or image
    </div>
  </div>

  <!-- ===== micro JS ===== -->
  <script>
    (function() {
      // just a friendly console message
      console.log('🏍️ RIDER · Superbike edition · all interactive elements are clickable!');
      
      // optional: add a small ripple effect on click (just for fun)
      document.querySelectorAll('.clickable').forEach(el => {
        el.addEventListener('click', function(e) {
          // we keep inline alerts, but also log
          // you could add a tiny visual feedback here
        });
      });
    })();
  </script>

</body>
</html>
